name: firmware-build

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Quote/0 版本"
        required: false
        default: "standard"
        type: choice
        options:
          - standard
          - early
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 发现 WiFi 预设 — 约定: 条目 name = WiFi 名称(SSID), value = 密码
      - name: Discover WiFi preset
        id: wifi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          API = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions"
          TOKEN = os.environ["GITHUB_TOKEN"]

          def fetch(path):
              req = urllib.request.Request(
                  API + path,
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "wifi-discover"},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          RESERVED = {"WIFI_SSID", "WIFI_PASSWORD", "ZHANGYU_WIFI_SSID",
                      "ZHANGYU_WIFI_PASSWORD", "ZHANGYU_SIGN", "ZHANGYU_STYLE",
                      "ZHANGYU_TITLE", "DOT_API_KEY", "DOT_DEVICE_ID"}

          def reserved(n):
              return n in RESERVED or n.startswith(("WIFI_", "ZHANGYU_", "DOT_"))

          try:
              variables = [(v["name"], v.get("value") or "")
                           for v in fetch("/variables?per_page=100").get("variables", [])]
          except Exception as e:
              print(f"::warning::读取 Variables 失败: {e}")
              variables = []
          try:
              secret_names = [s["name"] for s in fetch("/secrets?per_page=100").get("secrets", [])]
          except Exception as e:
              print(f"::warning::读取 Secrets 名称失败: {e}")
              secret_names = []

          # 1) 兼容固定命名: WIFI_SSID / ZHANGYU_WIFI_SSID (value = SSID, WIFI_PASSWORD = 密码)
          fixed = dict(variables)
          ssid = fixed.get("WIFI_SSID") or fixed.get("ZHANGYU_WIFI_SSID") or ""
          pw = fixed.get("WIFI_PASSWORD") or fixed.get("ZHANGYU_WIFI_PASSWORD") or ""
          sec = ""
          # 2) 约定命名(Variables): name = WiFi 名, value = 密码
          if not ssid:
              cand = sorted((n, v) for n, v in variables if not reserved(n))
              if len(cand) > 1:
                  print("::notice::发现多个疑似 WiFi 变量: " +
                        ", ".join(n for n, _ in cand) + " — 取字母序第一个")
              if cand:
                  ssid, pw = cand[0]
          # 3) 约定命名(Secrets): name = WiFi 名, 密码稍后由 secrets[...] 动态读取
          if not ssid:
              cand_s = sorted(n for n in secret_names if not reserved(n))
              if len(cand_s) > 1:
                  print("::notice::发现多个疑似 WiFi Secret: " +
                        ", ".join(cand_s) + " — 取字母序第一个")
              if cand_s:
                  sec = cand_s[0]
                  ssid = sec

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ssid={ssid}\npass={pw}\nsecret_name={sec}\n")
          if ssid:
              src = "Secret(name=SSID, 密码动态读取)" if (sec and not pw) else "Variable(name=SSID, value=密码)"
              print(f"已发现 WiFi 预设: SSID={ssid}  来源={src}")
          else:
              print("未发现 WiFi 预设 — 固件将走串口配网")
          PY

      - name: Inject WiFi & select display edition
        shell: bash
        env:
          CFG_WIFI_SSID: ${{ steps.wifi.outputs.ssid }}
          # 变量路径 value=密码; Secret 路径按 name 动态取 value(密码)
          CFG_WIFI_PASSWORD: ${{ steps.wifi.outputs.pass || (steps.wifi.outputs.secret_name != '' && secrets[format('{0}', steps.wifi.outputs.secret_name)]) || '' }}
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          # 预设 WiFi → 写入 sdkconfig.defaults (set-target 时生成进 sdkconfig, 固件首启从 NVS 播种)
          if [ -n "$CFG_WIFI_SSID" ]; then
            printf 'CONFIG_ZHANGYU_WIFI_SSID="%s"\nCONFIG_ZHANGYU_WIFI_PASSWORD="%s"\n' \
              "$CFG_WIFI_SSID" "$CFG_WIFI_PASSWORD" >> sdkconfig.defaults
            echo "::notice::已注入 GitHub 预设 WiFi: SSID=$CFG_WIFI_SSID (密码不回显)"
          else
            echo "::notice::GitHub 未发现 WiFi 预设 (name=WiFi名, value=密码), 固件走串口配网"
          fi
          # set-target 会生成 sdkconfig; 首发版在这里切换驱动
          idf.py set-target esp32c3 >/dev/null
          if [ "${{ github.event.inputs.edition }}" = "early" ]; then
            sed -i 's/^CONFIG_ZHANGYU_EPD_UC8251D=y$/# CONFIG_ZHANGYU_EPD_UC8251D is not set/; s/^# CONFIG_ZHANGYU_EPD_UC8151 is not set$/CONFIG_ZHANGYU_EPD_UC8151=y/' sdkconfig
          fi
          grep 'ZHANGYU_EPD' sdkconfig
          echo "::notice::$(grep -E 'CONFIG_ZHANGYU_WAKE_(HOUR|MINUTE)=' sdkconfig | tr '\n' ' ')"

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          set -o pipefail
          idf.py build 2>&1 | tee /tmp/build.log && exit 0
          # 失败: 把错误行提取成 annotations (沙箱看不到 CI 日志, 注释可见)
          echo "BUILD_FAILED"
          grep -nE 'error:|Error [0-9]+|undefined reference|CMake Error|FAILED:' /tmp/build.log \
            | tail -50 | while IFS= read -r line; do
                echo "::error::${line:0:350}"
              done
          {
            echo '### ❌ 编译失败 — 关键错误行'
            echo '```'
            grep -nE 'error:|Error [0-9]+|undefined reference|CMake Error|FAILED:' /tmp/build.log | tail -50
            echo '```'
            echo '### 日志尾部'
            echo '```'
            tail -40 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Merge full-flash image
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          python -m esptool --chip esp32c3 merge_bin -o build/zhangyu_daily_full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0000 build/bootloader/bootloader.bin \
            0x08000 build/partition_table/partition-table.bin \
            0x10000 build/zhangyu_daily.bin
          cat > build/烧录说明.txt <<'EOF'
          章鱼AI.每日占一占 — 烧录方法 (Quote/0, ESP32-C3)
          ================================================
          方式一: 单文件整片烧录 (推荐)
            pip install esptool
            esptool.py --chip esp32c3 -p /dev/ttyACM0 erase_flash
            esptool.py --chip esp32c3 -p /dev/ttyACM0 write_flash 0x0 zhangyu_daily_full.bin

          方式二: 分区烧录 (等价)
            esptool.py --chip esp32c3 -p /dev/ttyACM0 write_flash \
              0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 zhangyu_daily.bin

          烧录后首次启动:
            1. 屏幕显示「等待配置 WiFi」
            2. 连接 USB 打开串口终端 (115200):  python -m esptool --chip esp32c3 -b 115200 monitor
               或 idf.py monitor / screen /dev/ttyACM0 115200
            3. 输入:  wifi <SSID> [密码]
               可选:  sign 狮子座  或  sign random
            4. 保存后自动联网 → 显示今日运势 → 深度休眠, 之后每天 07:00 自动更新

          注意: 自定义固件会覆盖出厂固件 (保修失效, 见官方 custom-firmware-guide)
          EOF
          sed -i 's/^          //' build/烧录说明.txt
          ls -la build/*.bin build/烧录说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhangyu-daily-bin
          path: |
            firmware/build/zhangyu_daily_full.bin
            firmware/build/zhangyu_daily.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/烧录说明.txt
          if-no-files-found: error

      # 同时把 BIN 发布到 firmware-bin 分支 (单提交滚动更新, 便于 git 直接获取)
      - name: Publish bins to firmware-bin branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/firmware/build"
          STAGE=$(mktemp -d)
          cp "$SRC/zhangyu_daily_full.bin" "$SRC/zhangyu_daily.bin" \
             "$SRC/bootloader/bootloader.bin" \
             "$SRC/partition_table/partition-table.bin" \
             "$SRC/烧录说明.txt" "$STAGE/"
          if [ -f "$SRC/flash_args" ]; then cp "$SRC/flash_args" "$STAGE/"; fi
          SHA=$(sha256sum "$SRC/zhangyu_daily_full.bin" | awk '{print $1}')
          SIZE=$(stat -c%s "$SRC/zhangyu_daily_full.bin")
          printf '{"commit":"%s","size":%s,"sha256":"%s","built_at":"%s","run_url":"%s"}\n' \
            "$GITHUB_SHA" "$SIZE" "$SHA" "$(date -u +%FT%TZ)" \
            "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$STAGE/manifest.json"
          cd "$STAGE"
          git init -q -b firmware-bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "zhangyu_daily ${GITHUB_SHA:0:12} $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f -q origin firmware-bin
          echo "已发布到 firmware-bin 分支"
