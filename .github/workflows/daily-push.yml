name: 行情速报推送 (章鱼AI.行情速报)

on:
  schedule:
    # 交易时段逐小时推送（工作日；分钟 30 = 各半点行情）：
    #   UTC 01:30–08:30 → 京/澳 09:30–16:30 工作日 —— A股/港股盘中
    #   UTC 13:30–21:30 → 美东 09:30–17:30(夏令时)/08:30–16:30(冬令时) —— 美股盘中
    # 门控由 push --trading-only 精确裁剪（含夏令时/冬令时、收盘后多余触发直接跳过），
    # 所以这里宁可宽一点：cron 只保证"该在的时候在"，由脚本判断"该不该发"。
    - cron: "30 1-8,13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览（排版 + 请求体，不推送，无需任何凭据）"
        type: boolean
        default: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 凭据来源（三者取其一，优先级从左到右）：
      #   device_id : secrets.DOT_DEVICE_ID  →  vars.DOT_DEVICE_ID  →  config.json
      #   api_key   : secrets.DOT_API_KEY（只走 Secret，不要放 Variables）
      # device_id 只是设备序列号（非敏感），所以 Secret 和 Variable 都接受 ——
      # 之前只读 secrets，放错页面就会得到"未配置设备序列号"。
      - name: Preflight（凭据自检）
        env:
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID || vars.DOT_DEVICE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry_run=true — 跳过凭据硬校验，本次不会推送设备"
            python run_daily.py doctor || true
          else
            python run_daily.py doctor --require-credentials
          fi

      # 只读探测：真的拿 Key 去问 Dot 云一次（/fixed/list，不改设备内容）。
      # 目的是在"推送"之前就把 `HTTP 400 This API key is invalid` 变成一条
      # 带清单的 ::error:: 注释，而不是让人对着最终失败猜原因。
      # 只读探测两件事：Key 是否有效 + 设备的 loop/fixed 列表里有没有 Text API 槽位。
      # 后者是 404 的根因，能在推送前查出来并给出 App 里的操作步骤。
      - name: Verify API Key & Content（只读探测）
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID || vars.DOT_DEVICE_ID }}
        run: |
          out="$(python run_daily.py doctor --check-key --check-content 2>&1)" || true
          echo "$out"
          if grep -q "Key 有效性: ✅" <<< "$out"; then
            echo "::notice::API Key 与设备序列号均被 Dot 云接受"
          elif grep -q "Key 有效性: 跳过" <<< "$out"; then
            echo "::warning::凭据不全，跳过 Key 校验"
          elif grep -q "Key 有效性: ⚠️" <<< "$out"; then
            echo "::warning::无法判定 Key 有效性（网络/Dot 服务临时不可用），本次照常尝试推送"
          else
            echo "::error::API Key 校验未通过 — 见上方清单（引号/换行污染、Key 失效、Secret 填反、账号不符）"
          fi
          # Text API 内容槽位：两个列表都没有才是硬阻塞
          if grep -q "✅ 有 Text API 内容" <<< "$out"; then
            echo "::notice::设备列表里已有 Text API 内容，可以推送"
          elif grep -q "内容槽位: 跳过" <<< "$out"; then
            echo "::warning::凭据不全，跳过内容槽位检查"
          elif grep -q "❌ 没有 Text API 内容" <<< "$out"; then
            echo "::error::设备的循环/固定列表里都没有 Text API 内容 → Dot. App → 内容工坊 → 该设备 → 把「Text API」加入列表"
          fi
          # 行情源预检：东财/新浪都取不到时本地缓存兜底（拿不到数据不会让 run 变红，
          # 但值得一条警告——连续几天警告就该查数据源了）
          if grep -q "行情源: " <<< "$out"; then
            echo "::notice::行情源可用（见上方自检里的「行情源」一行）"
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Push index quotes to Dot device
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置：
          #   DOT_API_KEY    Dot. App 导出的 API Key（Secret）
          #   DOT_DEVICE_ID  设备序列号（Secret 或 Variable 均可）
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID || vars.DOT_DEVICE_ID }}
        run: |
          # 定时触发必须过交易时段门控（A股/港股或美股盘中），休市时脚本自跳过（exit 0）；
          # 手动 Run workflow 不加门控 —— 随时能看到卡片，方便验证。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FLAGS="--trading-only"
          else
            FLAGS=""
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run_daily.py push --dry-run --show-payload
          else
            python run_daily.py push --show-payload $FLAGS
          fi

      - name: Failure hints
        if: failure()
        run: |
          {
            echo "### ❌ 行情推送失败"
            echo ""
            echo "常见原因与处理："
            echo ""
            echo "| 现象 | 处理 |"
            echo "| --- | --- |"
            echo "| \`未配置 device_id\` | Settings → Secrets and variables → Actions：新建 Secret \`DOT_DEVICE_ID\`（或 Variable，同名）＝ 设备序列号 |"
            echo "| \`未配置 DOT_API_KEY\` | 同上页新建 Secret \`DOT_API_KEY\` ＝ Dot. App 导出的 \`dot_app_xxx\` |"
            echo "| 推送失败：404 没有文本 API 内容 | Dot. App → 内容工坊 / Content Studio → 该设备 → 把「Text API」内容加入循环列表（或固定列表）→ 保存 |"
            echo "| 404 但列表里确实有 Text API | 设备序列号不属于这台设备，或内容加到了另一个列表（可用 --task-type fixed 指定） |"
            echo "| 推送失败：400 \`This API key is invalid\` | Key 本身无效：Dot. App 重新导出（别带引号/空格）、确认没和 \`DOT_DEVICE_ID\` 填反；本地用 \`python run_daily.py doctor --check-key\` 复现 |"
            echo "| 推送失败：403 | 该 API Key 无权操作此设备 |"
            echo "| \`行情获取失败\` | 东财/新浪临时不可用且本地无缓存；重跑一次 workflow 即可（脚本会自动降级到新浪） |"
            echo "| 定时触发显示「非交易时段…跳过」 | 正常：休市时门控放行退出（run 为绿色）。若确认在盘中仍被跳过，检查是否撞上节假日休市 |"
            echo "| 只是想先看看卡片 | 重新运行本 workflow 时勾选 **dry_run**，或本地 \`python run_daily.py preview\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::推送失败 — 详见本次 run 的 Summary 与上方日志"
