name: 每日占星推送 (章鱼AI.每日占一占)

on:
  schedule:
    # 每天 UTC 00:30 = 北京/澳门时间 08:30
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      sign:
        description: "星座（留空则按仓库配置抽签，如 leo / 狮子座 / random）"
        required: false
        default: ""

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Push daily horoscope to Dot device
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置：
          #   DOT_API_KEY    Dot. App 导出的 API Key
          #   DOT_DEVICE_ID  设备序列号（也可放 config.json，但建议用 Secret）
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          DOT_DEVICE_ID: ${{ secrets.DOT_DEVICE_ID }}
          # 可选的仓库变量：固定星座（不设则按 config/抽签）
          ZHANGYU_SIGN: ${{ vars.ZHANGYU_SIGN || github.event.inputs.sign }}
        run: python run_daily.py push --show-payload
